# piBooth v2 configuration. Every key is optional; values shown are defaults.
# The Immich API key is NOT stored here: set PIBOOTH_IMMICH_API_KEY, or
# API_KEY in a .env file in the working directory (the service sets it to
# /opt/pibooth) (v1 compatible).

[storage]
root = "."            # photos/, raw/ and the upload queue/ are created under here
save_original = true  # keep the unfiltered photo in raw/

[camera]
tuning_file = ""      # empty = libcamera default (imx296.json)

[capture]
burst_frames = 6      # frames per photo (1..=12), ~0.15 s at 60 fps
stack = "average"     # average: less noise | sharpest: least blur | off: first frame only
max_shift_px = 8      # frames that moved more than this are left out of the average
save_dng = false      # also save raw/booth_<ts>.dng (3.2 MB each, not uploaded)
jpeg_quality = 95

[timing]
countdown_s = 5
review_s = 5
idle_s = 120

[display]
mirror_preview = true # preview only; saved photos are never mirrored
assets_dir = "."      # folder containing fonts/, images/ and effects/ (".." when running from v2/)

[filter]
enabled = true

[flash]
mode = "screen"       # screen | strobe | both | none
lead_ms = 300         # light on this long before the shot (exposure is metered under it)
max_ms = 800          # hard limit on the light; it goes off when the burst is in
gpio_line = 17        # strobe output (BCM), for strobe | both
active_high = true    # false: the strobe is on when the line is low

[button]
gpio_line = 27
active_low = false    # false: button to 3.3 V, internal pull-down (v1 wiring)
debounce_ms = 30

[immich]
base_url = ""         # API root incl. /api, e.g. "https://immich.example/api" (empty = upload off)
album_id = ""         # optional: album UUID from the album's URL
latitude = 0.0        # GPS omitted when both are 0.0
longitude = 0.0

[monitor]
temp_warn_c = 60
temp_crit_c = 65
disk_warn_pct = 70
disk_crit_pct = 90
