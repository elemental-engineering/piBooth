[package]
name = "pibooth"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Raspberry Pi 5 photo booth, v2"

[features]
default = []
# Real Pi camera support. Requires libcamera-dev (>= 0.4) at build time.
libcamera = ["dep:libcamera"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
fontdue = "0.9"
glow = "0.18"
glutin = "0.32"
glutin-winit = "0.5"
gpiocdev = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
libcamera = { version = "0.8", optional = true }
nix = { version = "0.30", features = ["fs"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"

[dev-dependencies]
kamadak-exif = "0.6"
tempfile = "3"

# Default codegen settings on purpose: LTO with codegen-units = 1 needs more
# RAM than a 4 GB Pi 5 has for the final crates and froze native builds.
# The app is GPU/camera-bound, so the extra optimisation buys nothing visible.
[profile.release]
